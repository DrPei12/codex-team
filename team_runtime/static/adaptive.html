<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex Team · 项目与协作</title><link rel="stylesheet" href="/adaptive.css"><script src="/adaptive.js" defer></script></head>
<body>
<header><div class="brand"><span class="mark">T</span><span>Codex Team</span><span class="tag">项目与协作</span></div><span id="connection" role="status">正在连接</span></header>
<main>
<aside><p class="eyebrow">你的项目</p><nav id="runs" aria-label="项目"></nav><p class="aside-note">在 Codex 对话中描述目标。这里保留项目进展、协作与交付依据。</p></aside>
<div id="empty" class="empty"><h1>从一个想完成的目标开始</h1><p>在 Codex 中使用 Team，讨论目标并形成方案后，项目会显示在这里。</p></div>
<article id="project" hidden>
<div class="project-heading"><div><p class="eyebrow">当前委托</p><h1 id="title"></h1><p id="summary" class="muted"></p></div><span id="status" class="badge"></span></div>
<div class="toolbar"><button id="run">开始 / 继续</button><button id="pause" class="secondary">暂停</button><button id="reconcile" class="secondary">核对恢复现场</button><button id="cancel" class="quiet">结束本轮</button><span id="action-status" role="status"></span></div>
<section class="definition"><details open><summary>目标与当前定义</summary><div id="definition" class="prose"></div></details></section>
<section><div class="section-heading"><h2>工作与责任</h2><span id="counts" class="muted"></span></div><div id="works" class="works"></div></section>
<div class="columns"><section><h2>协作与工作笔记</h2><div id="messages" class="messages"></div><form id="message-form"><label for="message-text">补充信息或调整想法</label><textarea id="message-text" rows="3" placeholder="写下影响当前工作的补充。Team 会在相关判断中读取。" required></textarea><button type="submit" class="secondary">保存到项目</button></form></section>
<section><h2>原始记录</h2><form id="search-form" class="search"><label class="sr-only" for="query">检索记录</label><input id="query" placeholder="查找决定、来源或失败原因"><button type="submit" class="secondary">检索</button></form><div id="events" class="events"></div><button id="more" class="quiet" hidden>继续读取</button></section></div>
<section id="delivery" hidden><h2>本轮交付</h2><div id="final-summary" class="prose"></div><p class="muted" id="acceptance-actor"></p></section>
</article>
</main>
<dialog id="result-dialog"><div class="dialog-heading"><h2>成果与验证记录</h2><button id="close-result" class="secondary">关闭</button></div><div id="result-report" class="prose"></div><div id="result-files"></div><details><summary>执行依据</summary><pre id="result-meta"></pre></details></dialog>
</body></html>
